name: EmtShop
options: { bundleIdPrefix: app.emtshop, deploymentTarget: { iOS: "17.0" } }
settings: { base: { SWIFT_VERSION: "5.9", MARKETING_VERSION: "0.1.0", CURRENT_PROJECT_VERSION: "1" } }
targets:
  EmtShop:
    type: application
    platform: iOS
    sources: [EmtShop]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: app.emtshop.mobile, } }
    info:
      path: EmtShop/Info.plist
      properties:
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        UILaunchScreen: {}
        CFBundleDisplayName: Emt Shop
        EmtShopBaseURL: "$(EMTSHOP_URL)"
